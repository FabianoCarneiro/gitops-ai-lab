apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: embedding-api-staging
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/SEU_USUARIO/gitops-ai-lab.git   # <- troque pelo seu fork
    targetRevision: main
    path: apps/embedding-api/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: embedding-api-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
