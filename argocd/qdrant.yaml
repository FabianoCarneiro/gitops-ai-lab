# Banco vetorial (Qdrant): chart Helm oficial + values versionados NESTE repositório
# (multi-source, Argo CD >= 2.6). Assim a configuração do Qdrant também é GitOps.
# ATENÇÃO: fixe a versão do chart antes da aula:
#   helm repo add qdrant https://qdrant.github.io/qdrant-helm && helm search repo qdrant/qdrant --versions | head
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qdrant
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://qdrant.github.io/qdrant-helm
      chart: qdrant
      targetRevision: "1.19.2"        # troque por uma versão exata (ex.: 1.x.y) — pin explícito
      helm:
        releaseName: qdrant
        valueFiles:
          - $values/apps/qdrant/values.yaml
    - repoURL: https://github.com/SEU_USUARIO/gitops-ai-lab.git   # <- troque pelo seu fork
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: qdrant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
