# Banco vetorial (Qdrant) instalado via Helm chart oficial, gerenciado pelo Argo CD.
# ATENÇÃO: confirme/fixe a versão do chart antes da aula:
#   helm repo add qdrant https://qdrant.github.io/qdrant-helm && helm search repo qdrant/qdrant --versions | head
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qdrant
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://qdrant.github.io/qdrant-helm
    chart: qdrant
    targetRevision: "1.*"        # troque por uma versão exata (ex.: 1.x.y) — pin explícito
    helm:
      releaseName: qdrant
      valuesObject:
        replicaCount: 1
        persistence:
          size: 1Gi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: qdrant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
