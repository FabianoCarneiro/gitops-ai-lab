apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: embedding-api-config
    literals:
      - MODEL_VERSION=v1          # <- "a versão do modelo" vive no Git
      - EMBED_DIM=64
      - QDRANT_URL=http://qdrant.qdrant.svc.cluster.local:6333
      - COLLECTION_PREFIX=docs
      - ENVIRONMENT=base
